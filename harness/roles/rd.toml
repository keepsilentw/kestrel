# RD：唯一源码写者——只在 worktree 内写。
role = "rd"
peer_id = "harness-rd"
bus_socket = "~/.kestrel/harness/bus.sock"

[llm]
provider = "deepseek-anthropic"  # 快执行者：轮数最多，速度/单价敏感
model = "deepseek-v4-flash"

[system]
prompt_file = "../systems/rd.md"   # 相对 role 文件所在目录（harness/roles/）

[permissions]
policy_file = "writer.policy.json"
# 派发工作树由环境给出（run-demo.sh 导出），role 文件本身不钉死某台机器的路径。
write_roots = ["$KESTREL_WORKTREE:-/tmp/kestrel-worktree"]
# 注意 `${VAR:-default}` 的花括号写法：裸写 `$VAR:-default` 时 `:-` 会吞掉整条
# 后缀，env 一旦设过，这里就变成 worktree 本身——整个工作树落进只读岛，RD 一个
# 文件都写不下去（design §9.32）。
read_only_islands = ["${KESTREL_WORKTREE:-/tmp/kestrel-worktree}/.git"]
# 反向审批：沙箱拒绝 / 策略 Ask 时问 SA（ApproveMode::Bus）。SA 无授权表或
# 沉默 60s 都按 deny 处理——worker 不会因等待审批而挂住回合。
approve = "bus"
approver = "harness-sa"
approve_timeout_secs = 60

[permissions.sandbox]
network = "none"
# 预算不在 role 里声明：花钱的上限由 SA 的 journal 账本统一停损（`--max-usd`），
# 角色文件里写一个没人读的 max_usd 只会让人以为它有效。
