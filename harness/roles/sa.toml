# SA（系统架构师）：唯一协调者——状态机、派发、预算账本、人工关卡对接。
role = "sa"
peer_id = "harness-sa"
bus_socket = "~/.kestrel/harness/bus.sock"

[llm]
provider = "qwen-anthropic"      # 旗舰：编排/拆解/收敛判定（providers.toml 引用）
model = "qwen3.8-max"

[system]
prompt_file = "../systems/sa.md"   # 相对 role 文件所在目录（harness/roles/）

[permissions]
policy_file = "sa.policy.json"   # SA 无写权限：只动 harness/ 元数据
write_roots = []
read_only_islands = []

[permissions.sandbox]
network = "none"
# SA 才是记账的人：`demo-sa --max-usd` 上限、journal 账本停损都由它执行。
# 它的审批授权表是 roles/sa.approvals.json（`demo-sa --approvals`），与这里的
# policy_file 分开：那份管 SA 自己能做什么，这份管它允许别人做什么。
